name: Dream Wi-Fi signed Android release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DREAM_WIFI_BASE_URL: ${{ vars.DREAM_WIFI_BASE_URL || 'https://dream-wifi-live.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Android architecture and credential-storage smoke test
        run: node scripts/dream-wifi-android-vpn-smoke-test.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Verify signing secrets and prepare private keystore file
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          case "$DREAM_WIFI_BASE_URL" in
            https://*) ;;
            *) echo "::error::DREAM_WIFI_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dream-wifi-release.jks"
          test -s "$RUNNER_TEMP/dream-wifi-release.jks"
          chmod 600 "$RUNNER_TEMP/dream-wifi-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/dream-wifi-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
      - name: Fetch pinned upstream TUN-to-SOCKS engine
        working-directory: android/dream-wifi-vpn/app
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git
          cd hev-socks5-tunnel
          git checkout 9b2c2320b26046b307abd6ddb5f102b2ccd1d4a4
          git submodule update --init --recursive
          sed -i 's/#define PKGNAME hev\/htproxy/#define PKGNAME com\/mjnr0477\/dreamwifi/' src/hev-jni.c
          sed -i 's/#define CLSNAME TProxyService/#define CLSNAME DreamVpnService/' src/hev-jni.c
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed release APK and Android App Bundle
        working-directory: android/dream-wifi-vpn
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dream-wifi-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -PDREAM_WIFI_BASE_URL="$DREAM_WIFI_BASE_URL" :app:assembleRelease :app:bundleRelease
      - name: Verify APK and AAB signatures and package identity
        run: |
          set -euo pipefail
          APK=android/dream-wifi-vpn/app/build/outputs/apk/release/app-release.apk
          AAB=android/dream-wifi-vpn/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -certs "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -q "SHA256:"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mjnr0477.dreamwifi' versionCode='1' versionName='0.1.0'"
          # Extract fingerprints without head pipelines, which can trigger SIGPIPE under pipefail. This check runs on every main update.
          APK_CERT="$( "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { if (!found) { print $2; found=1 } } END { if (!found) exit 1 }' )"
          AAB_CERT="$(keytool -printcert -jarfile "$AAB" | awk '/^[[:space:]]*SHA256:/ && !found { sub(/^[[:space:]]*SHA256:[[:space:]]*/, ""); print; found=1 } END { if (!found) exit 1 }' | tr -d ':')"
          APK_CERT="$(printf '%s' "$APK_CERT" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          AAB_CERT="$(printf '%s' "$AAB_CERT" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          echo "APK signing certificate SHA-256: $APK_CERT"
          echo "AAB signing certificate SHA-256: $AAB_CERT"
          test -n "$APK_CERT"
          test -n "$AAB_CERT"
          if [ "$APK_CERT" != "$AAB_CERT" ]; then
            echo "::error::The APK and AAB were signed with different certificates."
            exit 1
          fi
      - name: Generate release checksums
        run: |
          set -euo pipefail
          sha256sum \
            android/dream-wifi-vpn/app/build/outputs/apk/release/app-release.apk \
            android/dream-wifi-vpn/app/build/outputs/bundle/release/app-release.aab \
            > android-release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dream-wifi-signed-release
          path: |
            android/dream-wifi-vpn/app/build/outputs/apk/release/app-release.apk
            android/dream-wifi-vpn/app/build/outputs/bundle/release/app-release.aab
            android-release-sha256.txt
          if-no-files-found: error
