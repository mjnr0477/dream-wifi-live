name: Dream Wi-Fi Android VPN build

on:
  pull_request:
    paths:
      - "android/dream-wifi-vpn/**"
      - ".github/workflows/dream-wifi-android-vpn.yml"
      - ".github/workflows/dream-wifi-android-release.yml"
      - "scripts/dream-wifi-android-vpn-smoke-test.js"
  push:
    branches:
      - main
    paths:
      - "android/dream-wifi-vpn/**"
      - ".github/workflows/dream-wifi-android-vpn.yml"
      - ".github/workflows/dream-wifi-android-release.yml"
      - "scripts/dream-wifi-android-vpn-smoke-test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Android architecture and credential-storage smoke test
        run: node scripts/dream-wifi-android-vpn-smoke-test.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Fetch pinned upstream TUN-to-SOCKS engine
        working-directory: android/dream-wifi-vpn/app
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git
          cd hev-socks5-tunnel
          git checkout 9b2c2320b26046b307abd6ddb5f102b2ccd1d4a4
          git submodule update --init --recursive
          sed -i 's/#define PKGNAME hev\/htproxy/#define PKGNAME com\/mjnr0477\/dreamwifi/' src/hev-jni.c
          sed -i 's/#define CLSNAME TProxyService/#define CLSNAME DreamVpnService/' src/hev-jni.c
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android/dream-wifi-vpn
        run: gradle --no-daemon -PDREAM_WIFI_BASE_URL="${{ vars.DREAM_WIFI_BASE_URL || 'https://dream-wifi-live.onrender.com' }}" :app:assembleDebug
      - name: Validate signed release APK/AAB with an ephemeral CI-only key
        working-directory: android/dream-wifi-vpn
        env:
          DREAM_WIFI_BASE_URL: ${{ vars.DREAM_WIFI_BASE_URL || 'https://dream-wifi-live.onrender.com' }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dream-wifi-ci-only.jks"
          test_password="ci-only-not-for-distribution"
          trap 'rm -f "$keystore"' EXIT
          keytool -genkeypair -v -keystore "$keystore" -storepass "$test_password" -keypass "$test_password" -alias dream-wifi-ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Dream Wi-Fi CI, OU=CI, O=Dream Wi-Fi, L=Test, ST=Test, C=US"
          ANDROID_KEYSTORE_PATH="$keystore" \
          ANDROID_KEYSTORE_PASSWORD="$test_password" \
          ANDROID_KEY_ALIAS="dream-wifi-ci" \
          ANDROID_KEY_PASSWORD="$test_password" \
          gradle --no-daemon -PDREAM_WIFI_BASE_URL="$DREAM_WIFI_BASE_URL" :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: dream-wifi-android-builds-testing-only
          path: |
            android/dream-wifi-vpn/app/build/outputs/apk/debug/app-debug.apk
            android/dream-wifi-vpn/app/build/outputs/apk/release/app-release.apk
            android/dream-wifi-vpn/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
