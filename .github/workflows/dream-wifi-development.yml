name: Dream Wi-Fi isolated development verification

on:
  push:
    branches:
      - idea/500km-one-app-development-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend, discovery, and public-page tests
        run: npm test

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run Android architecture and discovery smoke tests
        run: node scripts/dream-wifi-android-vpn-smoke-test.js
      - name: Run global and local discovery smoke test
        run: node scripts/dream-wifi-global-discovery-smoke-test.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Fetch pinned upstream TUN-to-SOCKS engine
        working-directory: android/dream-wifi-vpn/app
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git
          cd hev-socks5-tunnel
          git checkout 9b2c2320b26046b307abd6ddb5f102b2ccd1d4a4
          git submodule update --init --recursive
          sed -i 's/#define PKGNAME hev\/htproxy/#define PKGNAME com\/mjnr0477\/dreamwifi/' src/hev-jni.c
          sed -i 's/#define CLSNAME TProxyService/#define CLSNAME DreamVpnService/' src/hev-jni.c
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build development debug APK without a production backend fallback
        working-directory: android/dream-wifi-vpn
        env:
          DREAM_WIFI_DEV_BASE_URL: ${{ vars.DREAM_WIFI_DEV_BASE_URL || 'https://dream-wifi-500km-dev.onrender.com' }}
        run: gradle --no-daemon -PDREAM_WIFI_BASE_URL="$DREAM_WIFI_DEV_BASE_URL" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dream-wifi-500km-development-debug-apk
          path: android/dream-wifi-vpn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
