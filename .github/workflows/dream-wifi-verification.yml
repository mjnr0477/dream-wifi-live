name: Dream Wi-Fi verification
on:
  push:
    branches: [main, work/requirements-baseline-audit]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Audit dependencies for moderate/high-severity advisories
        run: npm audit --audit-level=moderate
      - run: npm test
